spring.application.name=CMTC Portal
 Server Configuration
#####################################
server.port=8081

#####################################
# Database Configuration (MySQL)
#####################################
spring.datasource.url=jdbc:mysql://localhost:3306/madhyam_cms?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#####################################
# Hibernate / JPA Configuration
#####################################
# Show SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#####################################
# JWT Configuration
#####################################
jwt.secret=yourVeryStrongAndSecureJWTSecretKeyThatIsAtLeast256BitsLongAndRandom
# Token expiration in milliseconds (e.g., 24 hours)
jwt.expiration=86400000
                        # 24 hours in milliseconds

#####################################
# CORS Configuration (for frontend integration)
#####################################
spring.web.cors.allowed-origins=http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*